name = "nc4f"
version = "0.1.0"
license = "MIT"
maintainer = "limpid.mazarine@gmail.com"
author = "Han Tang"
copyright = "Copyright 2019-2026 Han Tang"
description = "NetCDF Fortran Library"
keywords = ["fortran", "modern-fortran", "NetCDF"]
homepage = "https://github.com/han190/nc4f.pack"

[build]
link = ["netcdf"]
auto-executables = false
auto-examples = false
auto-tests = false

[install]
library = true

[library]
source-dir = "src"

[features]
netcdf-paths.macos.flags = "-I/opt/homebrew/opt/netcdf/include"
netcdf-paths.macos.link-time-flags = "-L/opt/homebrew/opt/netcdf/lib"
flags-debug.gfortran.flags = """
  -g -Wall -Wextra -Wimplicit-interface -fPIC -fmax-errors=1 -fcheck=bounds \
  -fcheck=array-temps -fbacktrace -fcoarray=single
"""
flags-debug.flang.flags = "-O0 -g -fno-omit-frame-pointer -pedantic -fimplicit-none"
flags-release.gfortran.flags = "-O3"
flags-release.flang.flags = "-O3"

[profiles]
macos-homebrew = ["netcdf-paths", "flags-release"]
macos-homebrew-release = ["netcdf-paths", "flags-release"]
macos-homebrew-debug = ["netcdf-paths", "flags-debug"]

[[example]]
name = "mandelbrot"
source-dir = "example"
main = "mandelbrot.f90"

[[example]]
name = "temperature"
source-dir = "example"
main = "temperature.f90"

[[example]]
name = "write-netcdf"
source-dir = "example"
main = "write_netcdf.f90"

[[example]]
name = "read-netcdf"
source-dir = "example"
main = "read_netcdf.f90"

[[test]]
name = "test-suite"
source-dir = "test"
main = "nc4f_test.f90"

[test.dependencies]
test-drive = { git = "https://github.com/fortran-lang/test-drive", tag = "v0.6.1" }

[extra.fortitude.check]
ignore = ['C002', 'C071', 'C072', 'C121', 'C181']
line-length = 80
extend-exclude = [
  "src/nc4f_data_attribute_constructor.f90",
  "src/nc4f_data_variable_constructor.f90",
  "src/nc4f_data_extract.f90",
]

[extra.release]
channel = "beta"
tag = "0.1.0-beta.1"

[extra.fformat]
line-length = 120
indent = 2
base-indent = 0
indent-units = false
indent-procedures = true
indent-fypp = false
continuation = "indent"

[extra.fformat.spaces]
assignment = "add"

[extra.fformat.files]
extensions = ["f90", "inc", "fypp"]
