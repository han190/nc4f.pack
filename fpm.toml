name = "nc4f"
version = "0.1.0"
license = "MIT"
maintainer = "limpid.mazarine@gmail.com"
author = "Han Tang"
copyright = "Copyright 2019-2026 Han Tang"
description = "NetCDF Fortran Library"
keywords = ["fortran", "modern-fortran", "NetCDF"]
homepage = "https://github.com/han190/nc4f.pack"

[build]
link = ["netcdf"]

[install]
library = true

[library]
source-dir = "src"

[[example]]
name = "mandelbrot"
source-dir = "example"
main = "mandelbrot.f90"

[[example]]
name = "temperature"
source-dir = "example"
main = "temperature.f90"

[[test]]
name = "test-suite"
source-dir = "test"
main = "nc4f_test.f90"

[extra.fortitude.check]
ignore = ['C002', 'C071', 'C072', 'C121', 'C152', 'C181']
line-length = 120

[extra.release]
channel = "beta"
tag = "0.1.0-beta.1"
