name: netcdf4pack
run-name: Building netcdf4.pack by ${{ github.actor }}
on: [push]

jobs:
  Test-NetCDF4-PACK:
    runs-on : ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        gcc_version: [13]
    env:
      FC: gfortran-${{ matrix.gcc_version }}

    
    steps:
      - name: Use Checkout
        uses: actions/checkout@v1
    
      - name: Install dependencies
        if: contains( matrix.os, 'ubuntu' )
        run: sudo apt install gfortran-${{ matrix.gcc_version }} libnetcdf-dev pkg-config

      - name: Build
        if: contains( matrix.os, 'ubuntu' )
        run: PROFILE=release make

      - name: Test
        if: contains( matrix.os, 'ubuntu' )
        run: PROFILE=release make test
