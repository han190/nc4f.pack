name: nc4f
run-name: Testing nc4f by ${{ github.actor }}

on:
  push:
  pull_request:

jobs:
  test:
    name: Test with ${{ matrix.compiler.name }}
    runs-on: ubuntu-24.04
    container: fedora:45
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - name: gfortran 15
            command: gfortran-15
          - name: gfortran 16
            command: gfortran
          - name: LLVM flang
            command: flang

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          dnf install --assumeyes \
            curl \
            gcc-gfortran \
            gcc15-gfortran \
            flang \
            make \
            netcdf \
            netcdf-devel \
            perl-Digest-SHA \
            pkgconf-pkg-config \
            python3-fypp

      - name: Report compiler
        run: ${{ matrix.compiler.command }} --version

      - name: Build
        run: FC=${{ matrix.compiler.command }} make

      - name: Download integration fixtures
        run: make download-test-data

      - name: Test
        run: FC=${{ matrix.compiler.command }} make test

      - name: Inspect generated NetCDF file
        run: ncdump -h build/test-results/characters.nc
