name: nc4f
run-name: Testing nc4f by ${{ github.actor }}

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list \
            /etc/apt/sources.list.d/google-chrome.sources
          sudo apt-get update
          sudo apt-get install --yes libnetcdf-dev netcdf-bin pkg-config fypp

      - name: Report compiler
        run: gfortran-14 --version

      - name: Build
        run: FC=gfortran-14 make

      - name: Download integration fixtures
        run: make download-test-data

      - name: Test
        run: FC=gfortran-14 make test

      - name: Inspect generated NetCDF file
        run: ncdump -h build/test-results/characters.nc
