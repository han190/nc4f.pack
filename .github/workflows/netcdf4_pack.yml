name: netcdf4pack
run-name: Building netcdf4.pack by ${{ github.actor }}
on: [push]

jobs:
  Test-NetCDF4-PACK:
    runs-on: ubuntu-latest
    env:
      FC: gfortran-14

    steps:
      - name: Use Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes gfortran-14 libnetcdf-dev pkg-config fypp

      - name: Report compiler
        run: $FC --version

      - name: Build
        run: PROFILE=release make

      - name: Test
        run: PROFILE=release make test
