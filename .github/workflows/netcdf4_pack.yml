name: nc4f
run-name: Testing nc4f by ${{ github.actor }}

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    container: fedora:45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          dnf install --assumeyes \
            curl \
            gcc-gfortran \
            make \
            netcdf \
            netcdf-devel \
            perl-Digest-SHA \
            pkgconf-pkg-config \
            python3-fypp

      - name: Report compiler
        run: gfortran --version

      - name: Build
        run: FC=gfortran make

      - name: Download integration fixtures
        run: make download-test-data

      - name: Test
        run: FC=gfortran make test

      - name: Inspect generated NetCDF file
        run: ncdump -h build/test-results/characters.nc
