name: nc4f
run-name: Testing nc4f by ${{ github.actor }}

on:
  push:
  pull_request:

jobs:
  test:
    name: Test with ${{ matrix.compiler.name }}
    runs-on: ubuntu-24.04
    container: fedora:45
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - name: gfortran 15
            command: gfortran-15
          - name: gfortran 16
            command: gfortran
          - name: LLVM flang
            command: flang

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          dnf install --assumeyes \
            curl \
            cmake \
            ninja-build \
            gcc-gfortran \
            gcc15-gfortran \
            flang \
            make \
            netcdf \
            netcdf-devel \
            perl-Digest-SHA \
            pkgconf-pkg-config \
            python3-fypp

      - name: Report compiler
        run: ${{ matrix.compiler.command }} --version

      - name: Build
        run: FC=${{ matrix.compiler.command }} make

      - name: Download integration fixtures
        run: make download-test-data

      - name: Test
        run: FC=${{ matrix.compiler.command }} make test

      - name: Inspect generated NetCDF file
        run: ncdump -h build/test-results/characters.nc

      - name: Configure CMake with regenerated sources
        run: >-
          cmake -S . -B build/cmake -G Ninja
          -DCMAKE_Fortran_COMPILER=${{ matrix.compiler.command }}
          -DCMAKE_BUILD_TYPE=Debug -DNC4F_REGENERATE_SOURCES=ON

      - name: Build with CMake
        run: cmake --build build/cmake --parallel 2

      - name: Test with CTest
        run: ctest --test-dir build/cmake --output-on-failure

  test-intel:
    name: Test with Intel ifx (${{ matrix.profile }})
    runs-on: ubuntu-24.04
    container: fedora:44
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        profile: [Debug, Release]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          dnf install --assumeyes \
            curl \
            cmake \
            ninja-build \
            gcc \
            gcc-c++ \
            netcdf \
            netcdf-devel \
            perl-Digest-SHA \
            pkgconf-pkg-config \
            python3-fypp
          cat > /etc/yum.repos.d/oneAPI.repo <<'EOF'
          [oneAPI]
          name=Intel oneAPI repository
          baseurl=https://yum.repos.intel.com/oneapi
          enabled=1
          gpgcheck=1
          repo_gpgcheck=1
          gpgkey=https://yum.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB
          EOF
          # Intel added Fedora 44 support in the 2026.2 release.
          dnf install --assumeyes intel-oneapi-compiler-fortran-2026.2

      - name: Download integration fixtures
        run: ./scripts/download_test_data.sh

      - name: Build and test with CMake
        run: |
          source /opt/intel/oneapi/setvars.sh
          ifx --version
          cmake -S . -B build/cmake-ifx -G Ninja \
            -DCMAKE_Fortran_COMPILER=ifx \
            -DCMAKE_BUILD_TYPE=${{ matrix.profile }} \
            -DNC4F_REGENERATE_SOURCES=ON
          cmake --build build/cmake-ifx --parallel 2
          ctest --test-dir build/cmake-ifx --output-on-failure

      - name: Inspect generated NetCDF file
        run: ncdump -h build/test-results/characters.nc
